name: gnns
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy
  - polars
  - pytorch                # conda picks the CUDA build when an NVIDIA driver is present
  - pytorch_geometric
  - python-dotenv
  - pyyaml
  - requests
  - pytest
  - ruff
  - pyright
  - pip:
      - -e .