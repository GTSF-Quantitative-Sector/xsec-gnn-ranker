# Lint, type-check and test on every push to main, pull request and merge-queue entry.
# No data, API key or GPU needed: tests use temporary folders and synthetic data,
# and conda installs the CPU build of pytorch on the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue reruns both jobs on main + the PR before merging

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}  # login shell, so the conda env is active in every step
    steps:
      - uses: actions/checkout@v6

      - name: Cache conda packages
        uses: actions/cache@v5
        env:
          CACHE_NUMBER: 0  # bump to force a fresh cache
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yml') }}

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: gnns
          channel-priority: strict
          use-only-tar-bz2: true  # required for the package cache to work

      - run: ruff check
      - run: ruff format --check
      - run: pyright
      - run: pytest

  issues:  # what still blocks the PR's workstream; see scripts/issue_check.py
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/issue_check.py check --ci
        env:
          GH_TOKEN: ${{ github.token }}
