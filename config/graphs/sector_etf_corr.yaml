builder: sector_etf_correlation
universe: sector_etfs
params:
  window_bars: 60           # returns per correlation; <= features.min_history_bars

features:                   # this construction's equity node features
  min_history_bars: 60      # bar-axis positions before t; >= every window here
  list:
    - {name: momentum, bars: 20}
    - {name: momentum, bars: 60}
    - {name: volatility, bars: 20}
