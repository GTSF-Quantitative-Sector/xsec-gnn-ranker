builder: sector_etf_correlation
universe: sector_etfs
params:
  window_bars: 60           # returns per correlation; <= features.min_history_bars

features:                   # this construction's equity node features
  min_history_bars: 60      # bar-axis positions before t; >= every window here
  list:
    - {name: momentum, bars: 20}
    - {name: momentum, bars: 60}
    - {name: volatility, bars: 20}
extra_model_features: []    # builder-added node columns to also feed the model
model_edge_attrs: []        # edge columns fed to the model (edge_weight always is)

model:                      # gatv2 | graphsage | mlp; other keys are model arguments
  name: gatv2
  hidden: 32
  layers: 1                 # fully connected graph: one hop reaches every ETF; 2 oversmoothed
  heads: 2
  dropout: 0.1
baseline:                   # matched no-graph baseline: same features, no edges
  name: mlp
  hidden: 32                # same width and depth as the model
  layers: 1
  dropout: 0.1
