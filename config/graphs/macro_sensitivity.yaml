# --- 1. CONSTRUCTION, FIXED ---
builder: macro_sensitivity
universe: sector_etfs
sources:
  macro:
    path: macro               # dataset folder under data_root (docs/graphs/macro_sensitivity.md)

# --- 2. SHARED DATA SIDE: tuned in stage 1, then fixed for stage 2 ---
params:
  window_bars: 252        # tunable (>= min_obs)
  min_obs: 200            # tunable
  ridge: 10.0             # tunable
  lag_bars: 0             # Additional bar lag AFTER verified availability; robustness
                          # check, not a tuning choice: keep out of grids
  max_stale_bars: 2       # data hygiene, not a tuning choice: keep out of grids
  edge_mode: magnitude    # magnitude | signed | constant | shuffled; constant and shuffled
                          # are placebo controls, never picked by a grid
  seed: 7                 # seed for edge_mode: shuffled; not a setting
features:
  min_history_bars: 252   # derived: gnns sweep raises it to the grid's longest window
  list:
    - {name: momentum, bars: 21}
    - {name: momentum, bars: 63}
    - {name: momentum, bars: 126}
    - {name: volatility, bars: 21}
    - {name: volatility, bars: 63}
# Both models see the same macro state, exposures and interactions on equity nodes.
extra_model_features:
  - macro_level_rates
  - macro_level_credit
  - macro_level_vix
  - macro_level_oil
  - macro_level_gold
  - macro_change_rates
  - macro_change_credit
  - macro_change_vix
  - macro_change_oil
  - macro_change_gold
  - beta_rates
  - beta_credit
  - beta_vix
  - beta_oil
  - beta_gold
  - magnitude_rates
  - magnitude_credit
  - magnitude_vix
  - magnitude_oil
  - magnitude_gold
  - interaction_rates
  - interaction_credit
  - interaction_vix
  - interaction_oil
  - interaction_gold
  - context_level
  - context_change
  - factor_rates
  - factor_credit
  - factor_vix
  - factor_oil
  - factor_gold

# --- 3. GNN, tuned in stage 1 ---
model:
  name: gatv2
  hidden: 32
  layers: 2
  heads: 2
  dropout: 0.1
  train: {}               # this model's overrides of config.yaml train: (not seed)
model_edge_attrs: [beta]

# --- 4. BASELINE, tuned in stage 2 ---
baseline:
  name: mlp
  hidden: 32
  layers: 2
  dropout: 0.1
  train: {}               # this model's overrides of config.yaml train: (not seed)

# --- 5. SWEEP (gnns sweep) ---
# Keys are paths in this file. Which section each grid may sweep:
# docs/RESEARCH_PROTOCOL.md, "Settings: tuned vs fixed".
sweep:
  seeds: [0, 1, 2]
  model_grid:             # sections 2 and 3
    params.ridge: [1.0, 10.0, 100.0]
    model.hidden: [16, 32]
    model.train.lr: [0.003, 0.01]
  baseline_grid:          # section 4
    baseline.hidden: [16, 32]
    baseline.dropout: [0.0, 0.1]
    baseline.train.lr: [0.003, 0.01]
