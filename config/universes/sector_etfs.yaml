  - XLC           # communication services (from 2018)
  - XLE           # energy
  - XLF           # financials
  - XLI           # industrials
  - XLK           # technology
  - XLP           # consumer staples
  - XLRE          # real estate (from 2015)
  - XLU           # utilities
  - XLV           # health care
  - XLY           # consumer discretionary
